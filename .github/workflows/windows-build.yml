name: Windows Build (Portable + Installer)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      BUILD_DIR: cmake-build-release
      VCPKG_DEFAULT_TRIPLET: x64-mingw-dynamic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-protobuf

      - name: Configure CMake (Release)
        shell: msys2 {0}
        run: |
          cmake -S . -B $BUILD_DIR \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build $BUILD_DIR

      - name: Deploy Qt & DLLs
        shell: msys2 {0}
        run: |
          windeployqt $BUILD_DIR/TOTP_manager.exe

      - name: Create portable archive
        shell: bash
        run: |
          mkdir portable
          cp -r $BUILD_DIR/* portable/
          zip -r TOTP_manager-windows-portable.zip portable

      - name: Build NSIS installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer/windows_installer.nsi

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: TOTP_manager-windows-portable.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: TOTP_manager-setup.exe
