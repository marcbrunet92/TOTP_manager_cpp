name: Linux Build (Portable + Installer)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: cmake-build-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake ninja-build \
            qt6-base-dev qt6-tools-dev \
            protobuf-compiler libprotobuf-dev \
            appimage-tools \
            dpkg-dev fakeroot

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B $BUILD_DIR \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build $BUILD_DIR

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp $BUILD_DIR/TOTP_manager AppDir/usr/bin/
          linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/TOTP_manager \
            --plugin qt \
            --output appimage

      - name: Create DEB package
        run: |
          mkdir -p deb/usr/bin
          cp $BUILD_DIR/TOTP_manager deb/usr/bin/
          dpkg-deb --build deb TOTP_manager.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "*.AppImage"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: TOTP_manager.deb
