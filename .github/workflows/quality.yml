name: Code Quality (C++)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: cmake-build-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y \
            clang-tidy cppcheck \
            cmake ninja-build \
            qt6-base-dev protobuf-compiler

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B $BUILD_DIR \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          clang-tidy \
            $(find src -name "*.cpp") \
            -p $BUILD_DIR \
            --warnings-as-errors=* \
            || true

      - name: Run cppcheck
        run: |
          cppcheck src \
            --enable=all \
            --inconclusive \
            --std=c++20 \
            --error-exitcode=1 \
            --exclude=$BUILD_DIR/generated

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            $BUILD_DIR/compile_commands.json
